<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="orbGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Mesh Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 1; }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(6deg); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -100; }
    }
    @keyframes rotateCube {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orb-animated-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
    }
    .orb-animated-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
    }
    .floating-decor {
      animation: floatOrb 6s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashLine 4s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Ambience in Background -->
  <g class="orb-animated-1">
    <circle cx="220" cy="140" r="260" fill="url(#orbGlow1)" />
  </g>
  <g class="orb-animated-2">
    <circle cx="980" cy="280" r="280" fill="url(#orbGlow2)" />
  </g>
  <circle cx="600" cy="200" r="300" fill="url(#orbGlow3)" />

  <!-- Decorative 3D Wireframe / Texture Graphic Accents (Background & Sides) -->
  <g class="floating-decor" opacity="0.65" transform="translate(980, 130)">
    <!-- 3D PBR Cube Wireframe representation -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#818cf8" stroke-width="2" />
    <line x1="0" y1="-60" x2="0" y2="0" stroke="#818cf8" stroke-width="2" />
    <line x1="0" y1="0" x2="52" y2="30" stroke="#818cf8" stroke-width="2" />
    <line x1="0" y1="0" x2="-52" y2="30" stroke="#818cf8" stroke-width="2" />
    <!-- Texture shader node points -->
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    <circle cx="52" cy="-30" r="4" fill="#c084fc" />
    <circle cx="-52" cy="-30" r="4" fill="#ec4899" />
    <circle cx="0" cy="60" r="4" fill="#34d399" />
  </g>

  <g class="floating-decor" opacity="0.5" transform="translate(100, 290)">
    <!-- Geometric PBR sphere lines -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />
    <ellipse cx="0" cy="0" rx="45" ry="18" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Flowing Pipeline Curves -->
  <path d="M 120 60 Q 300 120 500 80 T 900 100 T 1150 40" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3" class="stream-line" />
  <path d="M 50 360 Q 350 320 600 370 T 1100 330" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.3" class="stream-line" />

  <!-- Content Layer (Guaranteed Foreground & High Contrast) -->
  <g transform="translate(100, 110)" filter="url(#shadow)">
    <!-- Top Pill / Category Indicator -->
    <g transform="translate(0, 0)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8" />
      <text x="30" y="20" class="badge-text" fill="#93c5fd">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 68)">
      <text class="title-text" fill="url(#primaryTextGrad)">Awesome 3D Texture Painting</text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 108)">
      <text class="subtitle-text">Physically Based (PBR) Texturing Suites, Layered Workflows &amp; Procedural 3D Software</text>
    </g>

    <!-- Feature Tags / Quick Attribute Badges -->
    <g transform="translate(0, 155)">
      <!-- Pill 1: PBR & Layer Stacks -->
      <g transform="translate(0, 0)">
        <rect width="170" height="34" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2" />
        <text x="14" y="22" class="badge-text" fill="#c7d2fe">🎨 PBR &amp; Layer Stacks</text>
      </g>

      <!-- Pill 2: Open Source & Self-Hosted -->
      <g transform="translate(185, 0)">
        <rect width="195" height="34" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
        <text x="14" y="22" class="badge-text" fill="#bae6fd">⚡ Open Source &amp; Hosted</text>
      </g>

      <!-- Pill 3: Procedural & AI Baking -->
      <g transform="translate(395, 0)">
        <rect width="195" height="34" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.2" />
        <text x="14" y="22" class="badge-text" fill="#f5d0fe">🪄 Procedural &amp; GPU Baking</text>
      </g>

      <!-- Pill 4: Production Ready -->
      <g transform="translate(605, 0)">
        <rect width="155" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
        <text x="14" y="22" class="badge-text" fill="#a7f3d0">🚀 Game &amp; VFX Pipelines</text>
      </g>
    </g>
  </g>
</svg>
